[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "planet-water-webapp"
version = "0.1.0"
description = "Streamlit web app for Planet water monitoring from time-series NDWI."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "OpenAI Codex" }]
dependencies = [
  "folium>=0.20.0",
  "numpy>=2.0.0",
  "pandas>=2.2.0",
  "plotly>=5.24.0",
  "python-dateutil>=2.9.0",
  "rasterio>=1.3.10",
  "sentinelhub>=3.11.0",
  "shapely>=2.0.0",
  "streamlit>=1.45.0",
  "streamlit-folium>=0.24.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

